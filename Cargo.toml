[workspace]
resolver = "3"
members = ["crates/kura-core", "crates/kura-app"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The master password KDF lives in a dependency. Unoptimised it takes seconds
# per sign-in, so optimise the dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 3
