name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Build and test
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.3.0
      - uses: jdx/mr-boxington-action@v1.7.4
        with:
          cache-key: mbx-check-objects-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: mbx-check-objects-${{ runner.os }}-${{ runner.arch }}-
          github-cache-mode: objects
          isolate-objects-cache: true
          cache-links: true
      - name: Format and lint
        shell: pwsh
        run: mise run lint
      - name: Test
        shell: pwsh
        run: cargo test --workspace
      - name: Audit dependencies
        shell: pwsh
        run: mise run audit
      - name: Test the changelog extractor
        shell: pwsh
        run: mise run test:packaging

  package:
    name: Package the installer
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.3.0
      - uses: jdx/mr-boxington-action@v1.7.4
        with:
          cache-key: mbx-package-objects-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: mbx-package-objects-${{ runner.os }}-${{ runner.arch }}-
          github-cache-mode: objects
          isolate-objects-cache: true
          cache-links: true
      - name: Install Inno Setup
        shell: pwsh
        run: mise run install-inno
      - name: Package the installer
        shell: pwsh
        env:
          ED25519_PUBLIC_KEY: ci-placeholder
        run: mise run package

  live:
    name: Live Vaultwarden
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      vaultwarden:
        image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
        env:
          SIGNUPS_ALLOWED: "true"
          I_REALLY_WANT_VOLATILE_STORAGE: "true"
          WEB_VAULT_ENABLED: "false"
        ports:
          - 18080:80
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: 1.97.1
          cache: false
          build-warnings: ""
      - uses: jdx/mr-boxington-action@v1.7.3
        with:
          version: "1.30.0"
      - name: Run the live test
        env:
          KURA_LIVE_URL: http://127.0.0.1:18080
        run: mbx test -p kura-core --lib live_ --locked -- --ignored --test-threads=1

  actions:
    name: Lint the workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify the action lockfile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-actions-lock --force --pin v0.5.1
          gh actions-lock --verify
      - uses: jdx/mise-action@v5.3.0
        with:
          install_args: "shellcheck jactionlint"
      - name: Lint the workflows
        shell: bash
        run: jactionlint
