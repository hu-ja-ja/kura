[package]
name = "kura-dist"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23"
ed25519-dalek = "3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "system-proxy"] }
# rustls needs exactly one crypto provider compiled in. `ring` is already in
# the dependency graph through the vault's client.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
url = "2"

[dev-dependencies]
tempfile = "3"
