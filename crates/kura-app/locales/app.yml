    en: "The server did not answer in time."
    ja: "サーバーの応答がありませんでした。"
  invalid_response:
    en: "The server sent an answer Kura cannot read."
    ja: "サーバーの応答を解釈できませんでした。"
  server:
    en: "The server refused the request"
    ja: "サーバーが要求を拒否しました"
  invalid_url:
    en: "That server URL cannot be used."
    ja: "そのサーバーURLは使用できません。"
  insecure_url:
    en: "Only https:// server URLs are allowed."
    ja: "https:// のサーバーURLだけを指定できます。"
  internal:
    en: "Something went wrong."
    ja: "問題が発生しました。"
