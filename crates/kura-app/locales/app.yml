error:
  missing_input:
    en: "Enter your email and master password."
    ja: "メールアドレスとマスターパスワードを入力してください。"
  invalid_credentials:
    en: "The email or the master password is wrong."
    ja: "メールアドレスかマスターパスワードが違います。"
  two_factor_failed:
    en: "That code was not accepted."
    ja: "コードが正しくありません。"
  two_factor_unsupported:
    en: "This account needs a two-step method Kura does not support."
    ja: "このアカウントはKuraが対応していない二段階認証方式を使っています。"
  rejected:
    en: "Refused by the server"
    ja: "サーバーに拒否されました"
