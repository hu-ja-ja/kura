[package]
name = "kura-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "kura"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Offscreen window capture for the README screenshots. Needs GPUI's test
# support to expose Window::render_to_image on Windows.
screenshots = ["dep:image", "gpui-kit/test-support"]

[dependencies]
clipboard-win = { version = "5", features = ["std"] }
gpui-kit = "0.9"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
kura-core = { path = "../kura-core" }
kura-dist = { path = "../kura-dist" }
kura-platform = { path = "../kura-platform" }
log = "0.4"
raw-window-handle = "0.6"
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
url = "2"
zeroize = "1"

[dev-dependencies]
gpui-kit = { version = "0.9", features = ["test-support"] }
tempfile = "3"

[build-dependencies]
winresource = "0.1"
