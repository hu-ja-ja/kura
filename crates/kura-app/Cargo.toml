[package]
name = "kura-app"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gpui-kit = "0.8"
kura-core = { path = "../kura-core" }
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
