[tools]
rust = { version = "1.97.1-x86_64-pc-windows-gnu", mr_boxington = true }
mr-boxington = "1.24.0"

[env]
GPUI_FXC_PATH = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\fxc.exe'

[tasks.run]
description = "Run the app"
run = "cargo run -p kura-app"

[tasks.check]
description = "Type-check the workspace"
run = "cargo check --workspace --all-targets"

[tasks.build]
description = "Release build"
run = "cargo build --release -p kura-app"
